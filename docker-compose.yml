name: dimaag

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: dimaag
      POSTGRES_PASSWORD: dimaag
      POSTGRES_DB: dimaag
    volumes:
      - dimaag_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dimaag -d dimaag"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      target: production
    environment:
      DATABASE_URL: postgres://dimaag:dimaag@postgres:5432/dimaag
      DWAR_BASE_URL: http://host.docker.internal:8080
      YAAD_BASE_URL: http://host.docker.internal:8090
      HOST: 0.0.0.0
      PORT: "8080"
      LOG_LEVEL: info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  dimaag_pg:
