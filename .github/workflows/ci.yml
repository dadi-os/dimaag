name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: hath-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hath
          POSTGRES_PASSWORD: hath
          POSTGRES_DB: hath
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hath -d hath"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Build dev image
        run: docker build --target dev -t hath-dev .

      - name: Migrate
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgres://hath:hath@localhost:5432/hath \
            -v "$PWD:/app" -v /app/node_modules \
            hath-dev npm run db:migrate

      - name: Test
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgres://hath:hath@localhost:5432/hath \
            -v "$PWD:/app" -v /app/node_modules \
            hath-dev npm test

      - name: Build production image
        run: docker build --target production -t hath-prod .

  publish:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hath:latest
            ghcr.io/${{ github.repository_owner }}/hath:${{ github.sha }}
