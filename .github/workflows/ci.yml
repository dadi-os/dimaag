name: CI

on:
  pull_request:
  push:
    branches: [main, ci-hang-probe]

concurrency:
  group: hath-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hath
          POSTGRES_PASSWORD: hath
          POSTGRES_DB: hath
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hath -d hath"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Build dev image
        run: docker build --target dev -t hath-dev .

      - name: Migrate
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgres://hath:hath@localhost:5432/hath \
            -e TZ=America/New_York \
            -v "$PWD:/app" -v /app/node_modules \
            hath-dev npm run db:migrate

      - name: Test
        timeout-minutes: 40
        run: |
          for i in $(seq 1 30); do
            docker run -d --name hath-t --network host \
              -e DATABASE_URL=postgres://hath:hath@localhost:5432/hath \
              -e TZ=America/New_York -e NODE_OPTIONS="--import /app/probe-handles.mjs" \
              -v "$PWD:/app" -v /app/node_modules \
              hath-dev npx tsx --test test/runtime.test.ts > /dev/null
            for s in $(seq 1 120); do
              [ "$(docker inspect -f '{{.State.Running}}' hath-t)" = "true" ] || break
              sleep 1
            done
            if [ "$(docker inspect -f '{{.State.Running}}' hath-t)" = "true" ]; then
              echo "=== HUNG on run $i"
              docker logs hath-t 2>&1 | grep -E "^(# |ok |not ok )" | tail -8
              docker exec hath-t ps -eo pid,pcpu,etime,args
              docker exec hath-t pkill -USR2 node; sleep 2
              docker logs hath-t 2>&1 | grep "\[probe" | tail -10
              docker run --rm --network host postgres:18 psql postgres://hath:hath@localhost:5432/hath -c "select pid, state, wait_event_type, wait_event, now()-query_start as age, left(query,160) as query from pg_stat_activity where datname='hath' and pid <> pg_backend_pid()"
              docker rm -f hath-t > /dev/null
              exit 1
            fi
            echo "run $i exit $(docker inspect -f '{{.State.ExitCode}}' hath-t) $(docker logs hath-t 2>&1 | grep -E '^# (pass|fail)' | tr '\n' ' ')"
            docker rm -f hath-t > /dev/null
          done
      - name: Build production image
        run: docker build --target production -t hath-prod .

  publish:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hath:latest
            ghcr.io/${{ github.repository_owner }}/hath:${{ github.sha }}
