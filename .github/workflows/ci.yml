name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: dimaag-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dimaag
          POSTGRES_PASSWORD: dimaag
          POSTGRES_DB: dimaag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dimaag -d dimaag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build dev image
        run: docker build --target dev -t dimaag-dev .

      - name: Run migrations
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgres://dimaag:dimaag@localhost:5432/dimaag \
            -e LOG_LEVEL=silent \
            -v "$PWD:/app" -v /app/node_modules \
            dimaag-dev npm run db:migrate

      - name: Run tests
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgres://dimaag:dimaag@localhost:5432/dimaag \
            -e LOG_LEVEL=silent \
            -v "$PWD:/app" -v /app/node_modules \
            dimaag-dev npm test

      - name: Build production image
        run: docker build --target production -t dimaag-prod .
